<!doctype html>
<meta charset="utf-8">
<title>Mini Shopping Mall — logo preview</title>
<style>
  body { margin:0; padding:32px; background:#f4f6fa; font:14px/1.5 system-ui,sans-serif; color:#334; }
  h2 { font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:#7a869a; margin:28px 0 10px; }
  .row { display:flex; gap:24px; align-items:flex-end; flex-wrap:wrap; }
  .card { background:#fff; padding:16px; border-radius:16px; box-shadow:0 2px 10px #0001; text-align:center; }
  .card span { display:block; margin-top:8px; font-size:11px; color:#8a94a6; }
  img { display:block; }
  .dark { background:#141a24; }
</style>
<h2>App icon — sky (primary)</h2>
<div class="row">
  <div class="card"><img src="icon.svg" width="256" height="256"><span>256</span></div>
  <div class="card"><img src="icon.svg" width="120" height="120"><span>120</span></div>
  <div class="card"><img src="icon.svg" width="60" height="60"><span>60</span></div>
  <div class="card"><img src="icon.svg" width="29" height="29"><span>29</span></div>
  <div class="card dark"><img src="icon.svg" width="120" height="120"><span style="color:#556">on dark</span></div>
</div>
<h2>Alt colourway + simplified (small sizes / favicon)</h2>
<div class="row">
  <div class="card"><img src="icon-sunset.svg" width="180" height="180"><span>sunset</span></div>
  <div class="card"><img src="icon-simple.svg" width="180" height="180"><span>simple</span></div>
  <div class="card"><img src="icon-simple.svg" width="32" height="32"><span>32</span></div>
</div>
<h2>Wordmark</h2>
<div class="row"><div class="card"><img src="wordmark.svg" width="520"></div></div>
<h2>Horizontal lockup</h2>
<div class="row"><div class="card"><img src="logo-lockup.svg" width="900"></div></div>

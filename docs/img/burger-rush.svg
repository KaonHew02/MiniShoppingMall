.2" marker-end="url(#head)"/><rect x="445.8" y="103" width="68.4" height="22" rx="11" fill="#D9453A"/><text x="480" y="119" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">slowest</text><rect x="610" y="118" width="150" height="64" rx="12" fill="#FFF6DC" stroke="#DC961A" stroke-width="2"/><text x="685" y="146.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#16295C">Assembly</text><text x="685" y="165.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5A6B8C">1.3 s, all parts up</text><path d="M510,54 L555,54 L555,150 L606,150" fill="none" stroke="#7D8DAA" stroke-width="2.2" marker-end="url(#head)"/><path d="M510,150 L555,150 L555,150 L606,150" fill="none" stroke="#7D8DAA" stroke-width="2.2" marker-end="url(#head)"/><path d="M510,246 L555,246 L555,150 L606,150" fill="none" stroke="#7D8DAA" stroke-width="2.2" marker-end="url(#head)"/><rect x="800" y="118" width="140" height="64" rx="12" fill="#FFFFFF" stroke="#2A6FD6" stroke-width="2"/><text x="870" y="146.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#16295C">Pickup</text><text x="870" y="165.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5A6B8C">holds 6 trays</text><path d="M760,150 L796,150" fill="none" stroke="#7D8DAA" stroke-width="2.2" marker-end="url(#head)"/><text x="685" y="216" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5A6B8C" letter-spacing="0" font-style="italic">the tray waits for the slowest part</text><text x="110" y="216" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#D9453A" letter-spacing="0" font-style="italic">a walkout is refunded</text>

<rect width="1060" height="290" fill="#FFFFFF"/>
<rect x="20" y="40" width="186" height="66" rx="12" fill="#FFFFFF" stroke="#2A6FD6" stroke-width="2"/><text x="113" y="69.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#16295C">Customer arrives</text><text x="113" y="88.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5A6B8C">street door or escalator</text><rect x="229" y="40" width="186" height="66" rx="12" fill="#FFFFFF" stroke="#2A6FD6" stroke-width="2"/><text x="322" y="69.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#16295C">Bubble shows the want</text><text x="322" y="88.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5A6B8C">patience ring starts</text><path d="M206,73 L225,73" fill="none" stroke="#7D8DAA" stroke-width="2.2" marker-end="url(#head)"/><rect x="438" y="40" width="186" height="66" rx="12" fill="#FFF6DC" stroke="#DC961A" stroke-width="2"/><text x="531" y="69.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#16295C">You do the work</text><text x="531" y="88.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5A6B8C">the step each shop changes</text><path d="M415,73 L434,73" fill="none" stroke="#7D8DAA" stroke-width="2.2" marker-end="url(#head)"/><rect x="647" y="40" width="186" height="66" rx="12" fill="#FFFFFF" stroke="#2A6FD6" stroke-width="2"/><text x="740" y="69.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#16295C">Sale completes</text><text x="740" y="88.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5A6B8C">till, tray, box or bag</text><path d="M624,73 L643,73" fill="none" stroke="#7D8DAA" stroke-width="2.2" marker-end="url(#head)"/><rect x="856" y="40" width="186" height="66" rx="12" fill="#E7F8EE" stroke="#2CA85C" stroke-width="2"/><text x="949" y="69.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#16295C">Cash drops</text><text x="949" y="88.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5A6B8C">a pile on the floor</text><path d="M833,73 L852,73" fill="none" stroke="#7D8DAA" stroke-width="2.2" marker-end="url(#head)"/><rect x="856" y="190" width="186" height="66" rx="12" fill="#E7F8EE" stroke="#2CA85C" stroke-width="2"/><text x="949" y="219.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#16295C">Walk over it</text><text x="949" y="238.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5A6B8C">or it banks itself in 9 s</text><rect x="438" y="190" width="186" height="66" rx="12" fill="#EAF3FD" stroke="#2A6FD6" stroke-width="2"/><text x="531" y="219.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#16295C">Spend it</text><text x="531" y="238.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5A6B8C">lines · levels · staff</text><rect x="20" y="190" width="186" height="66" rx="12" fill="#FFFFFF" stroke="#DC961A" stroke-width="2" stroke-dasharray="7 5"/><text x="113" y="219.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#16295C">Unlock the next shop</text><text x="113" y="238.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5A6B8C">the escalator opens</text><path d="M949,106 L949,186" fill="none" stroke="#2CA85C" stroke-width="2.2" marker-end="url(#headGreen)"/><path d="M856,223 L628,223" fill="none" stroke="#7D8DAA" stroke-width="2.2" marker-end="url(#head)"/><path d="M478,190 L478,150 L322,150 L322,110" fill="none" stroke="#7D8DAA" stroke-width="2.2" marker-end="url(#head)"/><text x="334" y="143" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5A6B8C" letter-spacing="0">a new line, a faster station, a hire</text><path d="M438,223 L210,223" fill="none" stroke="#DC961A" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#headGold)"/><text x="322" y="213" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5A6B8C" letter-spacing="0">enough saved</text>

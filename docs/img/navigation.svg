<rect width="940" height="380" fill="#FFFFFF"/>
<rect x="30" y="150" width="210" height="84" rx="12" fill="#EAF3FD" stroke="#2A6FD6" stroke-width="2"/><text x="135" y="178" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#16295C">Shop floor</text><text x="135" y="198" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5A6B8C">the canvas, always on</text><text x="135" y="218" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5A6B8C">HUD · objective line · dock</text><rect x="360" y="18" width="230" height="54" rx="12" fill="#FFFFFF" stroke="#2A6FD6" stroke-width="2"/><text x="475" y="41.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#16295C">Products</text><text x="475" y="60.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5A6B8C">lines · levels · builds</text><path d="M240,192 L300,192 L300,45 L356,45" fill="none" stroke="#7D8DAA" stroke-width="2.2" marker-end="url(#head)"/><rect x="360" y="88" width="230" height="54" rx="12" fill="#FFFFFF" stroke="#2A6FD6" stroke-width="2"/><text x="475" y="111.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#16295C">Staff</text><text x="475" y="130.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5A6B8C">hires · the shop’s own stats</text><path d="M240,192 L300,192 L300,115 L356,115" fill="none" stroke="#7D8DAA" stroke-width="2.2" marker-end="url(#head)"/><rect x="360" y="158" width="230" height="54" rx="12" fill="#FFFFFF" stroke="#2A6FD6" stroke-width="2"/><text x="475" y="181.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#16295C">Map</text><text x="475" y="200.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5A6B8C">the ring · travel · buy</text><path d="M240,192 L300,192 L300,185 L356,185" fill="none" stroke="#7D8DAA" stroke-width="2.2" marker-end="url(#head)"/><rect x="360" y="228" width="230" height="54" rx="12" fill="#FFFFFF" stroke="#2A6FD6" stroke-width="2"/><text x="475" y="251.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#16295C">Boost</text><text x="475" y="270.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5A6B8C">15 gems → ×2 for 60 s</text><path d="M240,192 L300,192 L300,255 L356,255" fill="none" stroke="#7D8DAA" stroke-width="2.2" marker-end="url(#head)"/><rect x="360" y="298" width="230" height="54" rx="12" fill="#FFFFFF" stroke="#7D8DAA" stroke-width="2"/><text x="475" y="321.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#16295C">Settings</text><text x="475" y="340.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5A6B8C">from the gear, not the dock</text><path d="M240,192 L300,192 L300,325 L356,325" fill="none" stroke="#7D8DAA" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#head)"/><rect x="670" y="158" width="250" height="54" rx="12" fill="#EAF3FD" stroke="#2A6FD6" stroke-width="2"/><text x="795" y="181.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#16295C">Another shop floor</text><text x="795" y="200.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5A6B8C">tap an owned box, or buy one</text><path d="M590,185 L666,185" fill="none" stroke="#7D8DAA" stroke-width="2.2" marker-end="url(#head)"/><rect x="670" y="298" width="250" height="54" rx="12" fill="#FFFFFF" stroke="#7D8DAA" stroke-width="2"/><text x="795" y="321.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#16295C">Save · Export · Import</text><text x="795" y="340.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5A6B8C">Drive · Language · Reset</text><path d="M590,325 L666,325" fill="none" stroke="#7D8DAA" stroke-width="2.2" marker-end="url(#head)"/><text x="30" y="268" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#16295C" letter-spacing="0">Escalator: stand and hold</text><text x="30" y="286" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5A6B8C" letter-spacing="0">→ the next shop in the ring</text><text x="670" y="40" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#16295C" letter-spacing="0">Every sheet closes back to the floor.</text><text x="670" y="58" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5A6B8C" letter-spacing="0">There is no back stack.</text>

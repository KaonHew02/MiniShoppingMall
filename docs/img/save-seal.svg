<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330">
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7D8DAA"/></marker><marker id="headRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9453A"/></marker><marker id="headGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2CA85C"/></marker><marker id="headGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC961A"/></marker></defs>
<rect width="960" height="330" fill="#FFFFFF"/>
<rect x="20" y="140" width="180" height="64" rx="12" fill="#EAF3FD" stroke="#2A6FD6" stroke-width="2"/><text x="110" y="168.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#16295C">A save arrives</text><text x="110" y="187.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5A6B8C">load · Import · Drive pull</text><rect x="250" y="140" width="170" height="64" rx="12" fill="#FFF6DC" stroke="#DC961A" stroke-width="2"/><text x="335" y="168.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#16295C">Seal intact?</text><text x="335" y="187.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5A6B8C">hash of the data + pepper</text><path d="M200,172 L246,172" fill="none" stroke="#7D8DAA" stroke-width="2.2" marker-end="url(#head)"/><rect x="480" y="140" width="250" height="64" rx="12" fill="#FFF6DC" stroke="#DC961A" stroke-width="2"/><text x="605" y="168.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#16295C">Unsealed, and before</text><text x="605" y="187.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#16295C">1 Nov 2026?</text><path d="M420,172 L476,172" fill="none" stroke="#D9453A" stroke-width="2.2" marker-end="url(#headRed)"/><text x="448" y="164" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#D9453A" letter-spacing="0">no</text><rect x="480" y="30" width="250" height="64" rx="12" fill="#E7F8EE" stroke="#2CA85C" stroke-width="2"/><text x="605" y="58.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#16295C">Clamp every number</text><text x="605" y="77.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5A6B8C">to what the game could make</text><rect x="790" y="30" width="150" height="64" rx="12" fill="#E7F8EE" stroke="#2CA85C" stroke-width="2"/><text x="865" y="58.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#16295C">Play on</text><text x="865" y="77.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5A6B8C">the save is loaded</text><path d="M335,140 L335,62 L476,62" fill="none" stroke="#2CA85C" stroke-width="2.2" marker-end="url(#headGreen)"/><text x="343" y="110" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2CA85C" letter-spacing="0">yes</text><path d="M605,140 L605,98" fill="none" stroke="#2CA85C" stroke-width="2.2" marker-end="url(#headGreen)"/><text x="613" y="124" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#2CA85C" letter-spacing="0">yes — a legacy save</text><path d="M730,62 L786,62" fill="none" stroke="#2CA85C" stroke-width="2.2" marker-end="url(#headGreen)"/><rect x="430" y="252" width="350" height="64" rx="12" fill="#FDECEA" stroke="#D9453A" stroke-width="2"/><text x="605" y="280.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#16295C">Refused</text><text x="605" y="299.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5A6B8C">set aside as msm.save.v12.rejected</text><path d="M605,204 L605,248" fill="none" stroke="#D9453A" stroke-width="2.2" marker-end="url(#headRed)"/><text x="613" y="232" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#D9453A" letter-spacing="0">no</text><text x="790" y="272" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5A6B8C" letter-spacing="0">fresh game, and Drive</text><text x="790" y="290" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5A6B8C" letter-spacing="0">auto-push stays off for</text><text x="790" y="308" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5A6B8C" letter-spacing="0">the whole session</text>
</svg>
